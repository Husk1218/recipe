name: recipe
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_auth: 4.17.8   
  firebase_core: 2.27.0
  firebase_storage: 11.6.9  
  cloud_firestore: ^4.14.0     
  cached_network_image: ^3.3.0    
  flutter_easyloading: ^3.0.5  
  intl: ^0.18.1
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.10.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/playstore.png"
  remove_alpha_ios: true
  
flutter:
  uses-material-design: true
  assets:
    - assets/
